name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # No dependencies, so no go.sum for the module cache to key on.
          cache: false
      - name: build and zip
        # The version comes from the tag, not `git describe`: checkout is shallow and has no tags.
        run: make dist VERSION=${{ github.ref_name }}
      - name: verify the bundle
        run: |
          codesign --verify --deep --strict build/Portkeeper.app
          plutil -lint build/Portkeeper.app/Contents/Info.plist
          plutil -lint build/Portkeeper.app/Contents/Library/LaunchAgents/*.plist
          ls -la dist
      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "Portkeeper ${{ github.ref_name }}" \
            --generate-notes \
            --notes "Apple Silicon build, ad-hoc signed and not notarized. See the README for how to open a downloaded copy."
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Portkeeper-macos-arm64
          path: dist/*.zip
